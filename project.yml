name: MomoPlayer
options:
  bundleIdPrefix: com.momo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  # 5.x 的 KSPlayer 核心是预编译 xcframework，只有模拟器 slice，编不了真机。
  # 2.3.4 是最后一批提供完整 Swift 源码的版本，直接源码编译即可支持真机。
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: 2.3.4

targets:
  MomoPlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources/MomoPlayer
        # Info.plist 由 INFOPLIST_FILE 处理，不要再当资源拷贝一遍
    dependencies:
      - package: KSPlayer
        product: KSPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momo.player
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # 未签名构建，签名在本地完成
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        # KSPlayer 是静态库，需要允许非模块化头文件
        CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES: YES
        OTHER_LDFLAGS:
          - -ObjC
          - -lc++
