name: build-ipa

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # arm64 的 macOS runner，编译 FFmpeg 静态库更快
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 查看 Xcode 版本
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 缓存 SPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 解析依赖
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MomoPlayer.xcodeproj \
            -scheme MomoPlayer

      - name: 构建（不签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -project MomoPlayer.xcodeproj \
            -scheme MomoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            2>&1 | tee xcodebuild.log
          # 只挑错误行，方便在日志里定位
          grep -E "error:|note: Building" xcodebuild.log | head -40 || true

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: 打包未签名 IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MomoPlayer.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "找不到 .app，列出构建产物："
            find build/Build/Products -maxdepth 3 -name "*.app" -print
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 未签名包必须删掉旧的签名残留
          rm -rf Payload/MomoPlayer.app/_CodeSignature
          zip -qry MomoPlayer-unsigned.ipa Payload
          ls -lh MomoPlayer-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MomoPlayer-ipa
          path: MomoPlayer-unsigned.ipa
          if-no-files-found: error

      - name: 收集日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/Logs
            ~/Library/Developer/Xcode/DerivedData/**/Logs
          if-no-files-found: ignore
